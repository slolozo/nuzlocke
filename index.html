  --red:#ee5a4a;--red-soft:#43211e;--hpg:#5cd07a;--hpg-soft:#173323;--hpy:#f0c443;--hpy-soft:#3a3115;--blue:#7fb0e4;--blue-soft:#1a2c40;
  --head:#a92a1f;--head-ink:#fff;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--head);color:var(--head-ink);border-bottom:3px solid rgba(0,0,0,.18)}
.top .in{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;padding:10px 16px}
.top svg{width:30px;height:30px;flex:none}
.top h1{font-family:var(--pixel);font-weight:700;font-size:19px;margin:0;line-height:1.1;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;opacity:.88}
.top .tt{min-width:0;flex:1}
.cap{font-family:var(--pixel);font-weight:700;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.45);border-radius:8px;padding:3px 9px;font-size:14px;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:14px 14px 28px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:2px solid var(--frame);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:flex;max-width:760px;margin:0 auto}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:650}
nav.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--red)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.4}
/* Gen 3 text-box frame */
.box{background:var(--paper);border:2px solid var(--frame);border-radius:10px;box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px var(--line);padding:14px;margin-bottom:12px}
.box.flat{box-shadow:none}
.box h2{font-family:var(--pixel);font-weight:700;font-size:18px;margin:0 0 8px;line-height:1.2}
.box h3{font-size:15px;margin:0 0 6px}
.sec-h{font-family:var(--pixel);font-weight:700;font-size:16px;margin:18px 4px 8px;color:var(--frame)}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.stack>*+*{margin-top:8px}
p{margin:0 0 8px}
.btn{appearance:none;border:2px solid var(--frame);background:var(--paper2);color:var(--ink);font-weight:700;padding:8px 14px;border-radius:9px;min-height:42px;font-size:14px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.good{background:var(--hpg);border-color:var(--hpg);color:#fff}
.btn.quiet{border-color:var(--line);background:transparent}
.btn.danger{border-color:var(--red);color:var(--red);background:transparent}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--paper2);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.chip.type{color:#fff;border-color:transparent;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.chip.pick{min-height:34px;font-size:13px;padding:4px 10px}
.st-open{background:var(--hpy-soft);color:var(--ink);border-color:transparent}
.st-caught{background:var(--hpg-soft);color:var(--hpg);border-color:transparent}
.st-skip{background:var(--paper2);color:var(--muted)}
.k-gift{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.k-static{background:var(--red-soft);color:var(--red);border-color:transparent}
.list{padding:0;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:11px 14px;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none}
.item:last-child{border-bottom:0}
.item .nm{display:flex;gap:6px;align-items:center;font-weight:700}
.item .sp{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res{text-align:right;display:flex;flex-direction:column;line-height:1.2;max-width:45%}
.res b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.res small{font-size:12px;color:var(--muted)}
.res.fail b{color:var(--red)}
.seg{display:flex;background:var(--paper);border:2px solid var(--frame);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:7px;font-size:13.5px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--frame);color:#fff}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper2);border:2px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-height:42px}
input:focus,select:focus,textarea:focus{border-color:var(--frame);outline:none}
textarea{min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper2);border:1px solid var(--line);border-radius:9px;padding:9px 6px;text-align:center}
.stat b{display:block;font-family:var(--pixel);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);font-weight:650}
.note{border-radius:9px;padding:10px 12px;font-size:13.5px;margin:8px 0;border:1px solid transparent}
.note.warn{background:var(--hpy-soft);border-color:var(--hpy)}
.note.bad{background:var(--red-soft);border-color:var(--red)}
.note.ok{background:var(--hpg-soft);border-color:var(--hpg)}
.note.info{background:var(--blue-soft);border-color:var(--blue)}
/* battle info box (signature element) */
.mon{position:relative;background:var(--paper);border:2px solid var(--frame);border-radius:12px 12px 12px 26px;padding:12px 12px 12px 14px;margin-bottom:10px;box-shadow:4px 4px 0 var(--line)}
.mon .hd{display:flex;align-items:baseline;gap:8px}
.mon .nk{font-family:var(--pixel);font-weight:700;font-size:19px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mon .lv{margin-left:auto;font-family:var(--pixel);font-weight:700;font-size:17px;white-space:nowrap}
.mon .lv small{font-size:12px;opacity:.8}
.mon .meta{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.hp{display:flex;align-items:center;gap:6px;margin:6px 0 4px}
.hp .lab{font-family:var(--pixel);font-weight:700;font-size:11px;background:var(--frame);color:#fff;border-radius:4px;padding:0 4px;line-height:16px}
.hp .bar{flex:1;height:9px;background:var(--paper2);border:2px solid var(--frame);border-radius:6px;overflow:hidden}
.hp .bar i{display:block;height:100%;background:var(--hpg)}
.hp .bar i.y{background:var(--hpy)}.hp .bar i.r{background:var(--red)}
.hp .num{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mon .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mon.over{border-color:var(--red)}
.ava{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--pixel);font-weight:700;font-size:15px;flex:none;border:2px solid rgba(0,0,0,.15);text-shadow:0 1px 0 rgba(0,0,0,.3)}
.mini{display:flex;flex-direction:column;align-items:center;gap:3px;width:64px;background:none;border:0;padding:0}
.mini b{font-size:12px;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini span{font-size:11px;color:var(--muted)}
.tomb{text-align:center;background:var(--paper2);border:2px solid var(--frame);border-radius:60px 60px 10px 10px;padding:22px 14px 14px;margin-bottom:12px}
.tomb .rip{font-family:var(--pixel);font-weight:700;font-size:14px;color:var(--muted)}
.tomb .nk{font-family:var(--pixel);font-weight:700;font-size:22px;margin:2px 0}
.tomb .ep{font-style:italic;margin:8px 0 4px}
.badges{display:flex;gap:7px;flex-wrap:wrap}
.badge{width:32px;height:32px;clip-path:polygon(50% 0,100% 38%,81% 100%,19% 100%,0 38%);background:var(--line);display:grid;place-items:center;font-family:var(--pixel);font-weight:700;font-size:12px;color:var(--muted);padding-top:4px}
.badge.on{background:var(--c);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.prog{height:10px;background:var(--paper2);border:2px solid var(--frame);border-radius:6px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--hpg)}
.boss{border-left-width:8px}
.boss.next{border-color:var(--red)}
.boss.beat{opacity:.72}
.boss .team{font-size:13.5px;margin:6px 0}
.big{font-family:var(--pixel);font-weight:700;font-size:40px;line-height:1}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:4px 6px;border-bottom:2px solid var(--frame)}
table.t td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.danger td{background:var(--red-soft)}table.t tr.caution td{background:var(--hpy-soft)}
.num{text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.sx{overflow-x:auto}
details.acc{border-bottom:1px solid var(--line)}
details.acc:last-child{border-bottom:0}
details.acc summary{font-weight:750;padding:12px 2px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.acc summary::after{content:"+";font-family:var(--pixel);font-size:18px;color:var(--frame)}
details.acc[open] summary::after{content:"−"}
details.acc summary::-webkit-details-marker{display:none}
details.acc .bd{padding:0 2px 12px}
details.acc ul,details.acc ol,.box ol,.box ul{margin:4px 0 8px;padding-left:20px}
details.acc li,.box li{margin:4px 0}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:background .15s}
.sw span::after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--hpg)}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.rule{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule b{display:block}
.log{list-style:none;padding:0;margin:8px 0 0}
.log li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.log li:last-child{border-bottom:0}
.log time{font-size:11.5px;color:var(--muted);white-space:nowrap;min-width:84px;font-variant-numeric:tabular-nums}
.modal-back{position:fixed;inset:0;background:rgba(10,18,26,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--paper);width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow:auto;border:2px solid var(--frame);border-bottom:0;border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
@media (min-width:640px){.modal-back{align-items:center}.modal{border-radius:16px;border-bottom:2px solid var(--frame)}}
.mh{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.mh h3{font-family:var(--pixel);font-weight:700;font-size:21px;margin:0;line-height:1.15}
.mh .x{margin-left:auto;border:2px solid var(--line);background:var(--paper2);border-radius:8px;width:38px;height:38px;flex:none;font-size:16px}
.kick{font-size:12.5px;color:var(--muted);font-weight:650}
.acts-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acts-row .btn{flex:1 1 auto}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:700;font-size:13.5px;z-index:70;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hero-name{font-family:var(--pixel);font-weight:700;font-size:26px;line-height:1.1;margin:0}
.starters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.starter{border:2px solid var(--line);background:var(--paper2);border-radius:12px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:13px}
.starter[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft)}
.party-strip{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:650}.kv dd{margin:0}
</style>
</head>

/* ---------- Helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function mons(st){return state.mons.filter(function(m){return m.status===st;});}
function monById(id){for(var i=0;i<state.mons.length;i++)if(state.mons[i].id===id)return state.mons[i];return null;}
function fmt(t){try{return new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return '';}}
function fmtDate(t){try{return new Date(t).toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'});}catch(e){return '';}}
function addLog(text){state.log.unshift({t:Date.now(),text:text});if(state.log.length>400)state.log.length=400;}
function typeChip(t){return '<span class="chip type" style="background:'+TC[t]+'">'+t+'</span>';}
function typesOf(m){var d=dex(m.species);return d?d.types:[];}
function avatar(sp){var d=dex(sp);var c=d?TC[d.types[0]]:'#7b8a98';return '<span class="ava" style="background:'+c+'">'+esc(String(sp||'?').slice(0,2))+'</span>';}
function nextBoss(){for(var i=0;i<BOSSES.length;i++)if(!state.beaten[BOSSES[i].id])return BOSSES[i];return null;}
function nextCap(){if(!state.rules.caps)return null;for(var i=0;i<BOSSES.length;i++){var b=BOSSES[i];if(CAPKINDS[b.kind]&&!state.beaten[b.id])return b;}return null;}
function badgeCount(){return BOSSES.filter(function(b){return b.badge&&state.beaten[b.id];}).length;}
function resolved(){return AREAS.filter(function(a){return state.enc[a.id];}).length;}
function bossLabel(b){return b.kind==='rival'?'Rival ('+b.where.split(',')[0]+')':b.kind==='rocket'?'Giovanni ('+b.where+')':b.name;}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on');},2200);}
function natOpts(sel){var h='<option value="">Unknown</option>';Object.keys(NATURES).forEach(function(n){h+='<option value="'+n+'"'+(n===sel?' selected':'')+'>'+n+(NATURES[n]?' ('+NATURES[n]+')':' (neutral)')+'</option>';});return h;}
function typeOpts(sel,blank){var h=blank?'<option value="">None</option>':'';TYPES.forEach(function(t){h+='<option'+(t===sel?' selected':'')+'>'+t+'</option>';});return h;}
function val(id){var el=document.getElementById(id);return el?el.value.trim():'';}
function checked(id){var el=document.getElementById(id);return !!(el&&el.checked);}
function applyTheme(){var r=document.documentElement;if(state.theme==='light'||state.theme==='dark')r.setAttribute('data-theme',state.theme);else r.removeAttribute('data-theme');}
function capBar(level,cap){
  if(!cap)return '';
  var pct=Math.min(100,Math.round(level/cap.ace*100));var cls=level>cap.ace?'r':(cap.ace-level<=2?'y':'');
  return '<div class="hp"><span class="lab">CAP</span><span class="bar"><i class="'+cls+'" style="width:'+pct+'%"></i></span><span class="num">'+level+' / '+cap.ace+'</span></div>';
}
function seg(key,v,label){return '<button data-act="seg" data-key="'+key+'" data-id="'+v+'" aria-pressed="'+(ui[key]===v)+'">'+label+'</button>';}

 {id:'routes',label:'Routes',icon:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>'},
 {id:'team',label:'Team',icon:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.6c2.4-.2 4.3 1.4 5 4.4"/>'},
 {id:'bosses',label:'Bosses',icon:'<path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H4.5a3 3 0 0 0 3.5 4M16 6h3.5a3 3 0 0 1-3.5 4M12 13v4M8.5 20h7"/>'},
 {id:'tools',label:'Tools',icon:'<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>'},
 {id:'rules',label:'Rules',icon:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/>'}
];
function renderNav(){document.getElementById('nav').innerHTML=TABS.map(function(t){return '<button data-act="tab" data-id="'+t.id+'"'+(ui.tab===t.id?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+t.icon+'</svg>'+t.label+'</button>';}).join('');}
function renderHeader(){
  document.getElementById('hTitle').textContent=state.runName||'FireRed Nuzlocke';
  document.getElementById('hSub').textContent=state.setup?('Attempt '+state.attempt+', '+badgeCount()+' of 8 badges'):'Offline tracker';
  var cap=nextCap(),el=document.getElementById('hCap');
  if(state.setup&&cap){el.hidden=false;el.textContent='Cap Lv '+cap.ace;}
  else if(state.setup&&state.rules.caps){el.hidden=false;el.textContent='No cap';}
  else el.hidden=true;
}
function render(scrollTop){
  applyTheme();renderNav();renderHeader();
  var v={run:viewRun,routes:viewRoutes,team:viewTeam,bosses:viewBosses,tools:viewTools,rules:viewRules}[ui.tab];
  document.getElementById('main').innerHTML=v();
  if(scrollTop)window.scrollTo(0,0);
}

/* ---------- Views: Run ---------- */
function viewSetup(){
  var p=ui.starterPick;
  var h='<div class="box"><h2>New run</h2><p class="muted small">Pick your starter, name it, and you’re off. Everything saves on this device and works offline.</p>';
  h+='<label class="f" for="s-name">Run name</label><input type="text" id="s-name" value="'+esc(state.runName)+'" maxlength="40">';
  h+='<label class="f">Starter</label><div class="starters">'+['Bulbasaur','Charmander','Squirtle'].map(function(s){return '<button class="starter" data-act="pickStarter" data-id="'+s+'" aria-pressed="'+(p===s)+'">'+avatar(s)+s+'</button>';}).join('')+'</div>';
  if(p==='Charmander')h+='<div class="note warn">Hard mode starter. Brock and Misty both resist Fire. Plan on catching Mankey or Nidoran♂ early, and Charmander gets Metal Claw at Lv 13.</div>';
  if(p==='Bulbasaur')h+='<div class="note ok">The easy-mode pick. Strong against Brock and Misty. Your rival takes Charmander.</div>';
  if(p==='Squirtle')h+='<div class="note ok">Solid choice. Handles Brock easily. Your rival takes Bulbasaur, so Misty is on you to figure out.</div>';
  h+='<div class="g2"><div><label class="f" for="s-nick">Nickname</label><input type="text" id="s-nick" maxlength="10" placeholder="10 letters max"></div><div><label class="f" for="s-nat">Nature</label><select id="s-nat">'+natOpts('')+'</select></div></div>';
  h+='<div class="acts-row"><button class="btn primary block" data-act="startRun">Start attempt '+state.attempt+'</button></div></div>';
  h+='<div class="box"><h3>Before you start</h3><ol class="small"><li>Check the Rules tab and turn the optional clauses on or off.</li><li>In FireRed, open Options and set Battle Style to SET (if that rule is on), Text Speed to FAST, and Battle Scene to OFF to save time.</li><li>Once it’s on your home screen and you’ve opened it once, it works with no signal at all.</li></ol>';
  h+='<div class="row wrap"><button class="btn quiet sm" data-act="tab" data-id="rules">Open rules</button><button class="btn quiet sm" data-act="importOpen">Restore a backup</button></div></div>';
  if(state.history.length)h+=historyBox();
  return h;
}
function historyBox(){
  var h='<div class="box"><h3>Past attempts</h3><ul class="log">';
  state.history.slice().reverse().forEach(function(r){h+='<li><time>#'+r.attempt+'</time><span><b>'+esc(r.result)+'</b>, '+r.badges+' badges, '+r.deaths+' deaths, '+r.caught+' caught. Ended '+esc(fmtDate(r.ended))+(r.lastBoss?'. Last boss: '+esc(r.lastBoss):'')+(r.survivors&&r.survivors.length?'. Survivors: '+esc(r.survivors.join(', ')):'')+(r.notes?'. “'+esc(r.notes)+'”':'')+'</span></li>';});
  return h+'</ul></div>';
}
function viewRun(){
  if(!state.setup)return viewSetup();
  var party=mons('party'),dead=mons('dead'),box=mons('box');
  var cap=nextCap(),nb=nextBoss();var done=resolved(),total=AREAS.length;
  var failed=AREAS.filter(function(a){return state.enc[a.id]&&state.enc[a.id].status==='failed';}).length;
  var h='';
  h+='<div class="box"><div class="row between wrap" style="align-items:flex-start"><div><p class="hero-name">'+esc(state.runName)+'</p><p class="muted small" style="margin:4px 0 0">Attempt '+state.attempt+', started '+esc(fmtDate(state.started))+'</p></div>'+(state.starter?avatar(state.starter):'')+'</div>';
  h+='<div class="badges" style="margin-top:12px" aria-label="Badges">'+BOSSES.filter(function(b){return b.badge;}).map(function(b){var on=state.beaten[b.id];return '<span class="badge'+(on?' on':'')+'" style="--c:'+b.c+'" title="'+b.badge+' Badge">'+b.badge.charAt(0)+'</span>';}).join('')+'</div>';
  h+='<div class="row between small" style="margin-top:12px"><span>Areas resolved</span><b>'+done+' of '+total+'</b></div><div class="prog"><i style="width:'+Math.round(done/total*100)+'%"></i></div></div>';
  if(!party.length&&state.mons.length)h+='<div class="note bad"><b>No one left in your party.</b> If you whited out, the run is over. End it below and start a fresh attempt. If you still have Pokémon in the box and didn’t black out, move them to the party on the Team tab.</div>';
  if(nb){
    var over=cap?party.filter(function(m){return m.level>cap.ace;}):[];
    h+='<div class="box"><div class="row between"><span class="kick">Next battle</span>'+(cap?'<span class="chip st-open">Level cap '+cap.ace+'</span>':'')+'</div>';
    h+='<h2 style="margin-top:4px">'+esc(bossLabel(nb))+'</h2><p class="muted small">'+esc(nb.where)+'</p><p class="small"><b>Team:</b> '+esc(nb.team())+'</p><p class="small">'+esc(nb.tip)+'</p>';
    if(over.length)h+='<div class="note bad">Over the cap: '+over.map(function(m){return esc(m.nick)+' (Lv '+m.level+')';}).join(', ')+'. Box them or stop leveling until after '+esc(cap.name)+'.</div>';
    h+='<div class="acts-row"><button class="btn good" data-act="beat" data-id="'+nb.id+'">Mark as beaten</button><button class="btn quiet" data-act="tab" data-id="bosses">All bosses</button></div></div>';
  }else{
    h+='<div class="box"><h2>Hall of Fame</h2><p>Every boss is down. That’s a completed nuzlocke. Archive it as a Hall of Fame run below, then go brag.</p></div>';
  }
  h+='<div class="g3" style="margin-bottom:12px">'+
    '<div class="stat"><b>'+party.length+'/6</b><span>Party</span></div>'+
    '<div class="stat"><b>'+box.length+'</b><span>Boxed</span></div>'+
    '<div class="stat"><b>'+dead.length+'</b><span>Deaths</span></div>'+
    '<div class="stat"><b>'+state.mons.length+'</b><span>Caught</span></div>'+
    '<div class="stat"><b>'+failed+'</b><span>Missed</span></div>'+
    '<div class="stat"><b>'+badgeCount()+'</b><span>Badges</span></div></div>';
  h+='<div class="box"><div class="row between"><h3 style="margin:0">Party</h3><button class="btn quiet sm" data-act="tab" data-id="team">Manage</button></div>';
  if(party.length)h+='<div class="party-strip">'+party.map(function(m){return '<button class="mini" data-act="editMon" data-id="'+m.id+'">'+avatar(m.species)+'<b>'+esc(m.nick)+'</b><span>Lv '+m.level+'</span></button>';}).join('')+'</div>';
  else h+='<p class="muted small">Your party is empty.</p>';
  h+='</div>';
  var on=OPT_RULES.filter(function(o){return state.rules[o.id];});
  h+='<div class="box"><div class="row between"><h3 style="margin:0">Rules for this run</h3><button class="btn quiet sm" data-act="tab" data-id="rules">Edit</button></div><div class="row wrap" style="margin-top:8px">'+(on.length?on.map(function(o){return '<span class="chip">'+esc(o.name)+'</span>';}).join(''):'<span class="muted small">Core rules only.</span>')+'</div></div>';
  h+='<div class="box"><h3>Run log</h3><div class="row"><input type="text" id="noteIn" placeholder="Add a note, like “Brock nearly killed Mochi”" maxlength="140"><button class="btn sm" data-act="addNote">Add</button></div>';
  var logs=ui.logAll?state.log:state.log.slice(0,8);
  h+='<ul class="log">'+(logs.length?logs.map(function(l){return '<li><time>'+esc(fmt(l.t))+'</time><span>'+esc(l.text)+'</span></li>';}).join(''):'<li class="muted">Nothing yet.</li>')+'</ul>';
  if(state.log.length>8)h+='<button class="btn quiet sm" data-act="logAll">'+(ui.logAll?'Show less':'Show all '+state.log.length)+'</button>';
  h+='</div>';
  h+='<div class="box"><h3>Run</h3>'+(offlineReady?'<div class="note ok" style="margin-top:0">Saved for offline use. This works with no signal.</div>':'<div class="note warn" style="margin-top:0">Not saved for offline use yet. Open it once with internet, from your home screen icon.</div>')+'<div class="row wrap"><button class="btn danger" data-act="endOpen">End this run</button><button class="btn quiet" data-act="settings">Settings</button><button class="btn quiet" data-act="exportOpen">Back up</button><button class="btn quiet" data-act="importOpen">Restore</button></div>'+(storageOk?'':'<div class="note bad">This browser isn’t letting the tracker save. Progress will be lost when you close the tab, so use Back up to copy it somewhere safe.</div>')+'</div>';
  if(state.history.length)h+=historyBox();
  return h;
}

/* ---------- Views: Routes ---------- */
function areaRow(a){
  var e=state.enc[a.id],right;
  if(!e)right='<span class="chip st-open">Open</span>';
  else if(e.status==='caught'){var m=monById(e.monId);right=m?'<span class="res"><b>'+(m.status==='dead'?'✝ ':'')+esc(m.nick)+'</b><small>'+esc(m.species)+'</small></span>':'<span class="chip st-caught">Caught</span>';}
  else if(e.status==='failed')right='<span class="res fail"><b>Missed</b><small>'+esc(e.species||'Unknown')+'</small></span>';
  else right='<span class="chip st-skip">Skipped</span>';
  var tag=a.kind==='gift'?' <span class="chip k-gift">Gift</span>':a.kind==='static'?' <span class="chip k-static">One shot</span>':'';
  var sub=a.sp.length?a.sp.join(', '):a.note;
  return '<button class="item" data-act="enc" data-id="'+a.id+'"><span class="grow"><span class="nm">'+esc(a.name)+tag+'</span><span class="sp">'+esc(sub)+'</span></span>'+right+'</button>';
}
function viewRoutes(){
  if(!state.setup)return '<div class="box"><h2>Routes</h2><p>Start a run first. Your starter becomes the Pallet Town encounter.</p><button class="btn primary" data-act="tab" data-id="run">Start a run</button></div>';
  var done=resolved(),total=AREAS.length,pct=Math.round(done/total*100);
  var h='<div class="seg">'+seg('rf','all','All')+seg('rf','open','Still open')+seg('rf','done','Done')+'</div>';
  h+='<div class="box"><div class="row between"><b>'+done+' of '+total+' areas resolved</b><span class="muted small">'+pct+'%</span></div><div class="prog"><i style="width:'+pct+'%"></i></div><p class="muted small" style="margin:8px 0 0">Tap an area to log what you found. The species listed are common FireRed finds for quick picking, not full encounter tables.</p></div>';
  SECS.forEach(function(s,i){
    var items=AREAS.filter(function(a){return a.sec===i&&(ui.rf==='all'||(ui.rf==='open'?!state.enc[a.id]:!!state.enc[a.id]));});
    if(!items.length)return;
    h+='<div class="sec-h">'+esc(s)+'</div><div class="box list">'+items.map(areaRow).join('')+'</div>';
  });
  if(ui.rf==='open'&&done===total)h+='<div class="note ok">Every area is resolved. Nothing left to catch.</div>';
  return h;
}

/* ---------- Views: Team ---------- */
function monCard(m){
  var cap=nextCap(),t=typesOf(m),over=cap&&m.level>cap.ace&&m.status!=='dead';
  var nat=m.nature?(m.nature+(NATURES[m.nature]?' ('+NATURES[m.nature]+')':'')):'';
  var meta=[m.species];if(nat)meta.push(nat);if(m.ability)meta.push(m.ability);
  var h='<div class="mon'+(over?' over':'')+'"><div class="row" style="align-items:flex-start;gap:12px">'+avatar(m.species)+'<div class="grow">';
  h+='<div class="hd"><span class="nk">'+esc(m.nick)+(m.gender==='M'?' ♂':m.gender==='F'?' ♀':'')+(m.shiny?' ✦':'')+'</span><span class="lv"><small>Lv </small>'+m.level+'</span></div>';
  h+='<div class="meta">'+esc(meta.join(', '))+'</div><div class="row wrap" style="gap:4px">'+t.map(typeChip).join('')+'</div>';
  if(m.status!=='dead')h+=capBar(m.level,cap);
  var mv=(m.moves||[]).filter(Boolean);if(mv.length)h+='<div class="tiny muted" style="margin-top:4px">'+esc(mv.join(', '))+'</div>';
  h+='<div class="tiny muted" style="margin-top:2px">Met at '+esc(m.where||(AREA[m.area]?AREA[m.area].name:'unknown'))+(m.metLevel?' at Lv '+m.metLevel:'')+'</div>';
  if(over)h+='<div class="note bad" style="margin-bottom:0">Over the level cap of '+cap.ace+'.</div>';
  h+='</div></div><div class="acts">';
  h+='<button class="btn sm" data-act="lvUp" data-id="'+m.id+'" aria-label="Level up '+esc(m.nick)+'">Lv +1</button>';
  h+='<button class="btn sm" data-act="editMon" data-id="'+m.id+'">Edit</button>';
  if(m.status==='party')h+='<button class="btn sm" data-act="toBox" data-id="'+m.id+'">To box</button>';
  else h+='<button class="btn sm" data-act="toParty" data-id="'+m.id+'">To party</button>';
  h+='<button class="btn sm danger" data-act="faintOpen" data-id="'+m.id+'">Fainted</button></div></div>';
  return h;
}
function tombCard(m){
  var d=m.death||{};
  return '<div class="tomb"><div class="rip">Here lies</div><div class="nk">'+esc(m.nick)+'</div><div class="small">'+esc(m.species)+', Lv '+(d.level||m.level)+'</div>'+
  (d.by||d.where?'<p class="small" style="margin:8px 0 0">Fell to '+esc(d.by||'something')+(d.where?' at '+esc(d.where):'')+'</p>':'')+
  (d.epitaph?'<p class="ep">“'+esc(d.epitaph)+'”</p>':'')+
  '<p class="tiny muted" style="margin:6px 0 10px">Caught at '+esc(AREA[m.area]?AREA[m.area].name:(m.where||'unknown'))+(d.t?', died '+esc(fmtDate(d.t)):'')+'</p>'+
  '<button class="btn sm quiet" data-act="editMon" data-id="'+m.id+'">View</button></div>';
}
function viewTeam(){
  if(!state.setup)return '<div class="box"><h2>Team</h2><p>Start a run on the Run tab first.</p></div>';
  var p=mons('party'),b=mons('box'),d=mons('dead');
  var h='<div class="seg">'+seg('seg','party','Party '+p.length+'/6')+seg('seg','box','Box '+b.length)+seg('seg','grave','Graveyard '+d.length)+'</div>';
  if(ui.seg==='party'){
    h+=p.length?p.map(monCard).join(''):'<div class="box"><p>Nobody in the party. Move someone up from the box, or log a catch on the Routes tab.</p></div>';
  }else if(ui.seg==='box'){
    h+=b.length?b.map(monCard).join(''):'<div class="box"><p>The box is empty. Catches go here automatically once your party is full.</p></div>';
  }else{
    h+=d.length?'<p class="muted small" style="margin:0 4px 10px">'+d.length+' fallen. They will not be forgotten.</p>'+d.slice().reverse().map(tombCard).join(''):'<div class="box"><p>The graveyard is empty. Enjoy it while it lasts.</p></div>';
  }
  if(ui.seg!=='grave')h+='<button class="btn quiet block" data-act="editMon" data-id="new">Add a Pokémon manually (trade, gift, fix a mistake)</button>';
  return h;
}

/* ---------- Views: Bosses ---------- */
function viewBosses(){
  var nb=nextBoss(),cap=nextCap();
  var h='<div class="box"><p class="small" style="margin:0">Level caps come from each gym leader’s and Elite Four member’s strongest Pokémon. Rival and Giovanni fights are listed for prep only and don’t set a cap. '+(state.starter?'Rival teams are worked out from your '+esc(state.starter)+'.':'Pick a starter and the rival teams fill in.')+' Numbers with ~ are approximate.</p></div>';
  BOSSES.forEach(function(b){
    var beat=!!state.beaten[b.id],isNext=nb&&nb.id===b.id;
    var color=b.c||(b.kind==='rival'?'#2f6aa8':b.kind==='rocket'?'#5b3b69':'#d8392b');
    var label=b.badge?b.badge+' Badge':b.kind==='rival'?'Rival battle':b.kind==='rocket'?'Team Rocket':b.kind==='e4'?'Elite Four':'Champion';
    h+='<div class="box boss'+(isNext?' next':'')+(beat?' beat':'')+'" style="border-left-color:'+(isNext?'var(--red)':color)+'">';
    h+='<div class="row between"><span class="kick">'+esc(label)+'</span><span class="chip'+(CAPKINDS[b.kind]?' st-open':'')+'">'+(CAPKINDS[b.kind]?'Cap ':'Ace ')+'Lv '+b.ace+'</span></div>';
    h+='<h2 style="margin:4px 0 2px">'+esc(b.name)+(beat?' ✓':'')+'</h2><p class="muted small">'+esc(b.where)+'</p>';
    h+='<p class="team"><b>Team:</b> '+esc(b.team())+'</p><p class="small">'+esc(b.tip)+'</p>';
    h+='<button class="btn sm '+(beat?'quiet':'good')+'" data-act="beat" data-id="'+b.id+'">'+(beat?'Undo':'Mark as beaten')+'</button></div>';
  });
  return h;
}

/* ---------- Views: Tools ---------- */
function defGroups(types,name){
  var g={'4':[],'2':[],'0.5':[],'0.25':[],'0':[]};
  TYPES.forEach(function(t){var m=eff(t,types,name);if(m!==1&&g[String(m)])g[String(m)].push(t);});
  var rows=[['4','4x damage'],['2','2x damage'],['0.5','Half damage'],['0.25','Quarter damage'],['0','No effect']];
  return rows.filter(function(r){return g[r[0]].length;}).map(function(r){return '<div style="margin:6px 0"><div class="tiny muted" style="font-weight:700;margin-bottom:3px">'+r[1]+'</div><div class="row wrap" style="gap:4px">'+g[r[0]].map(typeChip).join('')+'</div></div>';}).join('');
}
function viewTools(){
  var cap=nextCap(),party=mons('party'),tc=ui.tc;
  var h='<div class="box"><div class="row between"><div><span class="kick">Current level cap</span><div class="big">'+(cap?cap.ace:state.rules.caps?'None':'Off')+'</div></div><div class="small muted" style="text-align:right;max-width:55%">'+(cap?'Set by '+esc(cap.name)+'. Don’t level anyone past this until you beat them.':state.rules.caps?'Every capped boss is beaten.':'Level caps are turned off in Rules.')+'</div></div></div>';
  h+='<div class="box"><h2>Party weaknesses</h2>';
  if(!party.length)h+='<p class="muted small">Add Pokémon to your party to see how it holds up.</p>';
  else{
    var unknown=party.filter(function(m){return !dex(m.species);});
    var rows=TYPES.map(function(t){var w=0,r=0,i=0;party.forEach(function(m){var d=dex(m.species);if(!d)return;var x=eff(t,d.types,d.name);if(x===0)i++;else if(x>1)w++;else if(x<1)r++;});return {t:t,w:w,r:r,i:i};}).sort(function(a,b){return (b.w-(b.r+b.i))-(a.w-(a.r+a.i))||b.w-a.w;});
    h+='<p class="muted small">How many party members take extra damage from each attacking type. Red rows mean three or more weak and nobody to switch in.</p><div class="sx"><table class="t"><thead><tr><th>Attack type</th><th class="num">Weak</th><th class="num">Resist</th><th class="num">Immune</th></tr></thead><tbody>';
    rows.forEach(function(r){var cls=r.w>=3&&r.r+r.i===0?'danger':(r.w>=2&&r.r+r.i===0?'caution':'');h+='<tr class="'+cls+'"><td>'+typeChip(r.t)+'</td><td class="num">'+(r.w||'')+'</td><td class="num">'+(r.r||'')+'</td><td class="num">'+(r.i||'')+'</td></tr>';});
    h+='</tbody></table></div>';
    if(unknown.length)h+='<p class="tiny muted">Skipped (species not recognized): '+esc(unknown.map(function(m){return m.species;}).join(', '))+'.</p>';
  }
  h+='</div>';
  var sp=dex(tc.sp),dtypes=sp?sp.types:[tc.d1].concat(tc.d2&&tc.d2!==tc.d1?[tc.d2]:[]);
  h+='<div class="box"><h2>Type checker</h2><h3>Defending</h3><label class="f" for="tc-sp">Look up a Pokémon</label><input type="text" id="tc-sp" list="dexlist" value="'+esc(tc.sp)+'" placeholder="Like Onix or Gengar">';
  if(tc.sp&&!sp)h+='<p class="tiny muted" style="margin-top:4px">Not found in the Kanto list. Use the type pickers below.</p>';
  if(!sp)h+='<div class="g2"><div><label class="f" for="tc-d1">Type 1</label><select id="tc-d1" data-tc="d1">'+typeOpts(tc.d1)+'</select></div><div><label class="f" for="tc-d2">Type 2</label><select id="tc-d2" data-tc="d2">'+typeOpts(tc.d2,true)+'</select></div></div>';
  h+='<div class="row wrap" style="gap:4px;margin:10px 0 2px">'+(sp?'<b style="margin-right:4px">'+esc(sp.name)+'</b>':'')+dtypes.map(typeChip).join('')+(sp&&LEV[sp.name]?' <span class="chip">Levitate</span>':'')+'</div>'+defGroups(dtypes,sp?sp.name:'');
  if(sp)h+='<button class="btn quiet sm" data-act="tcClear" style="margin-top:6px">Clear</button>';
  var atk=tc.atk,se=[],nve=[],imm=[];TYPES.forEach(function(t){var m=CH[atk][t];if(m===2)se.push(t);else if(m===.5)nve.push(t);else if(m===0)imm.push(t);});
  h+='<h3 style="margin-top:16px">Attacking</h3><label class="f" for="tc-atk">Move type</label><select id="tc-atk" data-tc="atk">'+typeOpts(atk)+'</select><p class="tiny muted" style="margin:6px 0 0">'+atk+' moves are '+(PHYS.indexOf(atk)>-1?'physical (use Attack)':'special (use Sp. Atk)')+' in Gen 3.</p>';
  [['Super effective against',se],['Not very effective against',nve],['No effect on',imm]].forEach(function(g){if(g[1].length)h+='<div style="margin:6px 0"><div class="tiny muted" style="font-weight:700;margin-bottom:3px">'+g[0]+'</div><div class="row wrap" style="gap:4px">'+g[1].map(typeChip).join('')+'</div></div>';});
  h+='</div>';
  h+='<div class="box"><h2>Physical or special?</h2><p class="small">In Gen 3, the move’s type decides whether it uses Attack or Sp. Atk. That’s why Gyarados’s Water moves run off its weaker Sp. Atk and Gengar’s Shadow Ball runs off its weak Attack.</p><div class="tiny muted" style="font-weight:700;margin:8px 0 3px">Physical (Attack)</div><div class="row wrap" style="gap:4px">'+PHYS.map(typeChip).join('')+'</div><div class="tiny muted" style="font-weight:700;margin:10px 0 3px">Special (Sp. Atk)</div><div class="row wrap" style="gap:4px">'+SPEC.map(typeChip).join('')+'</div></div>';
  h+='<div class="box"><h2>Natures</h2><div class="sx"><table class="t"><thead><tr><th>Nature</th><th>Raises</th><th>Lowers</th></tr></thead><tbody>';
  Object.keys(NATURES).forEach(function(n){var e=NATURES[n].split(' ');h+='<tr><td><b>'+n+'</b></td><td>'+(e[0]?esc(e[0].slice(1)):'<span class="muted">Neutral</span>')+'</td><td>'+(e[1]?esc(e[1].slice(1)):'')+'</td></tr>';});
  h+='</tbody></table></div></div>';
  return h;
}

/* ---------- Views: Rules & Guide ---------- */
function acc(title,body,open){return '<details class="acc"'+(open?' open':'')+'><summary>'+title+'</summary><div class="bd small">'+body+'</div></details>';}
function viewRules(){
  var h='<div class="box"><h2>Core rules</h2><ol class="small">'+CORE_RULES.map(function(r){return '<li>'+esc(r)+'</li>';}).join('')+'</ol></div>';
  h+='<div class="box"><h2>Optional clauses</h2><p class="muted small">These change how strict the run is. The tracker checks dupes, shinies and level caps for you. The rest are on the honor system.</p>';
  OPT_RULES.forEach(function(o){h+='<div class="rule"><div class="grow"><b>'+esc(o.name)+'</b><span class="small muted">'+esc(o.desc)+'</span></div><label class="sw"><input type="checkbox" data-rule="'+o.id+'"'+(state.rules[o.id]?' checked':'')+' aria-label="'+esc(o.name)+'"><span></span></label></div>';});
  h+='</div>';
  h+='<div class="box"><h2>Guide</h2>';
  h+=acc('How to use this tracker','<ol><li><b>Run tab:</b> start a run by picking your starter. The run tab then shows your badges, next boss, level cap, stats, party, and a log of everything that happened.</li><li><b>Routes:</b> tap an area the moment you see its first Pokémon. Tap a suggested species (or type one), then pick <i>Caught</i>, <i>Missed</i> (it fled, fainted or broke free) or <i>Skip</i>. Catches go to your party, or to the box once you have six.</li><li><b>Team:</b> level up with Lv +1, edit natures, abilities and moves, swap between party and box, and mark deaths. Deaths ask what killed them and let you write an epitaph.</li><li><b>Bosses:</b> every gym, rival, Giovanni and Elite Four fight with teams, levels and counters. Mark them beaten to move the level cap.</li><li><b>Tools:</b> your party’s weaknesses, a type checker, the physical/special split and a natures chart.</li><li><b>Wiped?</b> Use End this run on the Run tab. The attempt is saved to your history and a new one starts.</li></ol>',true);
  h+=acc('Offline use and backups','<ul><li>This app is saved on your phone. Once you’ve opened it from the home screen one time, it opens and works with no signal, even after you close it or restart your phone.</li><li>Progress saves automatically in this browser on this device. It does not sync anywhere else.</li><li>Use <b>Back up</b> on the Run tab now and then. It gives you a block of text to paste into your Notes app. <b>Restore</b> loads it back.</li><li>Clearing your browser data erases the tracker’s save, so back up first.</li></ul>');
  h+=acc('Miyoo Mini tips','<ul><li>Save in-game (Start, then Save) after every catch and before every boss. In-game saves are your real save file.</li><li>Keep save states for crashes and a dying battery only, not for undoing deaths.</li><li>Set FireRed’s Options: Text Speed FAST, Battle Scene OFF, Battle Style SET. Battle Scene OFF alone saves a lot of time over a long run.</li><li>Fast-forward is fine for walking and grinding up to the cap. Turn it off for boss fights so you don’t mash through a bad prompt.</li><li>Charge it fully before the trip. If the SD card came preloaded with the device, back up your save file when you can, because those cards are known to fail.</li></ul>');
  h+=acc('FireRed survival guide','<ul><li><b>Brock:</b> Bulbasaur and Squirtle make it easy. Charmander should pick up Mankey (Route 22), Nidoran♂ (Route 3) or a Butterfree, and Charmander learns Metal Claw at Lv 13.</li><li><b>Misty:</b> Starmie is the real gym. Bring Grass or Electric and be at the cap.</li><li><b>Lt. Surge:</b> grab a Diglett. Ground types ignore Electric attacks.</li><li><b>Erika:</b> bring status heals or a Poison type, because sleep powder can lose you a Pokémon.</li><li><b>Koga:</b> watch for Self-Destruct. Lead with something you can afford to have hurt.</li><li><b>Sabrina:</b> Alakazam outspeeds almost everything. A Dark type, or a strong physical hitter, is the answer.</li><li><b>Silph Co. and the rival on 7F:</b> a big difficulty spike. Arrive at Koga’s cap with healing items.</li><li><b>Giovanni:</b> Water and Grass. Lapras from Silph Co. handles this whole gym.</li><li><b>Elite Four:</b> no healing between members except your own items. Plan your team for all five fights before you walk in, and save before Lorelei.</li><li><b>Catching:</b> False Swipe isn’t easy to get in FireRed, so carry a weak move and status moves (sleep or paralysis) for catching. Stock up on Ultra Balls once shops start selling them in the mid-game.</li></ul>');
  h+=acc('Gen 3 quirks to remember','<ul><li><b>Physical vs special</b> depends on the type, not the move. See the Tools tab.</li><li><b>Abilities matter:</b> Levitate (Gastly line, Koffing line) makes Ground moves miss. Intimidate (Growlithe line, Gyarados, Ekans line) lowers your Attack when it switches in.</li><li><b>No Fairy type.</b> Clefairy, Jigglypuff and Mr. Mime are Normal or Psychic here.</li><li><b>Pokémon that evolve into Johto species</b> (like Golbat into Crobat) can’t do so until you have the National Pokédex after the Hall of Fame.</li><li><b>Crits</b> are doubled damage and ignore stat boosts. Don’t trust a Pokémon at low HP to survive one more hit.</li></ul>');
  h+='</div>';
  h+='<div class="box"><h3>Appearance</h3><div class="seg" style="margin:8px 0 0">'+['auto','light','dark'].map(function(t){return '<button data-act="theme" data-id="'+t+'" aria-pressed="'+(state.theme===t)+'">'+(t==='auto'?'Match phone':t==='light'?'Light':'Dark')+'</button>';}).join('')+'</div></div>';
  return h;
}

/* ---------- Modals ---------- */
function closeModal(){var m=document.querySelector('.modal-back');if(m)m.remove();document.body.style.overflow='';pending=null;}
function modal(html){
  var old=document.querySelector('.modal-back');if(old)old.remove();
  var back=document.createElement('div');back.className='modal-back';
  back.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';
  back.addEventListener('click',function(e){if(e.target===back)closeModal();});
  document.body.appendChild(back);document.body.style.overflow='hidden';
  return back.querySelector('.modal');
}
function mh(kick,title){return '<div class="mh"><div><div class="kick">'+esc(kick)+'</div><h3>'+esc(title)+'</h3></div><button class="x" data-act="close" aria-label="Close">✕</button></div>';}
function confirmBox(title,body,okLabel,fn,danger){
  modal(mh('Confirm',title)+'<p class="small">'+body+'</p><div class="acts-row"><button class="btn quiet" data-act="close">Cancel</button><button class="btn '+(danger?'primary':'good')+'" data-act="confirmOk">'+esc(okLabel)+'</button></div>');
  pending=fn;
}
function dupeHtml(sp,exceptId){
  var d=dex(sp);if(!sp)return '';
  if(!d)return '<div class="note info">Not in the Kanto list, so the dupe check can’t run. It will still be saved as typed.</div>';
  var hit=state.mons.filter(function(m){var x=dex(m.species);return m.id!==exceptId&&x&&x.fam===d.fam;})[0];
  if(!hit)return '<div class="note ok">New species line. Good to go.</div>';
  return state.rules.dupes?'<div class="note warn"><b>Dupe.</b> You already have '+esc(hit.nick)+' ('+esc(hit.species)+', same line). With the dupes clause on, ignore this one and keep looking.</div>':'<div class="note warn">Same line as '+esc(hit.nick)+'. The dupes clause is off, so this encounter still counts.</div>';
}
function openEnc(id){
  var a=AREA[id],e=state.enc[id];
  var kick=a.kind==='gift'?'Gift Pokémon':a.kind==='static'?'One-shot encounter':'Encounter';

  if(a.note)h+='<p class="muted small">'+esc(a.note)+'</p>';
  if(e){
    if(e.status==='caught'){var m=monById(e.monId);h+=m?'<div class="note ok">Caught <b>'+esc(m.nick)+'</b> the '+esc(m.species)+(m.status==='dead'?'. Now resting in the Graveyard.':'.')+'</div>':'<div class="note ok">Caught.</div>';}
    else if(e.status==='failed')h+='<div class="note bad">Missed '+esc(e.species||'it')+'. This area is done.</div>';
    else h+='<div class="note info">Skipped.</div>';
    h+='<div class="acts-row">'+(e.status==='caught'&&monById(e.monId)?'<button class="btn" data-act="editMon" data-id="'+e.monId+'">Open Pokémon</button>':'')+'<button class="btn danger" data-act="resetEnc" data-id="'+id+'">Reset area</button></div>';
    modal(h);return;
  }
  if(LEGENDS[id]&&state.rules.legends)h+='<div class="note warn">Your no-legendaries rule is on. You can still log it, but it can’t join your team.</div>';
  if(a.sp.length)h+='<div class="kick" style="margin-top:8px">Common here, tap to fill</div><div class="row wrap" style="gap:6px;margin-top:6px">'+a.sp.map(function(s){return '<button class="chip pick" data-act="pickSp" data-id="'+esc(s)+'">'+esc(s)+'</button>';}).join('')+'</div>';
  h+='<label class="f" for="e-sp">Species</label><input type="text" id="e-sp" list="dexlist" autocomplete="off" placeholder="What showed up?"><div id="dupe"></div>';
  h+='<div class="g2"><div><label class="f" for="e-nick">Nickname</label><input type="text" id="e-nick" maxlength="10"></div><div><label class="f" for="e-lv">Level</label><input type="number" id="e-lv" min="1" max="100" inputmode="numeric" value="'+esc(a.lv)+'"></div></div>';
  h+='<div class="g2"><div><label class="f" for="e-nat">Nature</label><select id="e-nat">'+natOpts('')+'</select></div><div><label class="f" for="e-g">Gender</label><select id="e-g"><option value="">Unknown or none</option><option value="M">Male ♂</option><option value="F">Female ♀</option></select></div></div>';
  if(state.rules.shiny)h+='<label class="row small" style="margin-top:12px;gap:10px"><span class="sw"><input type="checkbox" id="e-shiny"><span></span></span>Shiny (bonus catch, keeps this area open)</label>';
  h+='<div class="acts-row"><button class="btn good" data-act="encCaught" data-id="'+id+'">Caught it</button><button class="btn danger" data-act="encFailed" data-id="'+id+'">Missed it</button><button class="btn quiet" data-act="encSkip" data-id="'+id+'">Skip area</button></div>';
  var el=modal(h);
  el.querySelector('#e-sp').addEventListener('input',function(){document.getElementById('dupe').innerHTML=dupeHtml(this.value.trim());});
}
function openMon(id){
  var isNew=id==='new',m=isNew?{species:'',nick:'',level:5,nature:'',ability:'',item:'',moves:['','','',''],notes:'',gender:''}:monById(id);
  if(!m)return;

  h+='<label class="f" for="m-nat">Nature</label><select id="m-nat">'+natOpts(m.nature)+'</select>';
  h+='<div class="g2"><div><label class="f" for="m-ab">Ability</label><input type="text" id="m-ab" value="'+esc(m.ability)+'" placeholder="Like Blaze"></div><div><label class="f" for="m-item">Held item</label><input type="text" id="m-item" value="'+esc(m.item)+'"></div></div>';
  h+='<label class="f">Moves</label><div class="g2">'+[0,1,2,3].map(function(i){return '<input type="text" id="m-mv'+i+'" value="'+esc((m.moves||[])[i]||'')+'" placeholder="Move '+(i+1)+'" style="margin-bottom:8px" aria-label="Move '+(i+1)+'">';}).join('')+'</div>';
  if(isNew)h+='<label class="f" for="m-where">Where you got it</label><input type="text" id="m-where" list="wherelist" placeholder="Like an in-game trade in Vermilion">';
  h+='<label class="f" for="m-notes">Notes</label><input type="text" id="m-notes" value="'+esc(m.notes)+'" maxlength="160" placeholder="Anything worth remembering">';
  if(!isNew&&m.status==='dead'&&m.death){var d=m.death;h+='<div class="note bad" style="margin-top:12px">Fell to '+esc(d.by||'something')+(d.where?' at '+esc(d.where):'')+', Lv '+(d.level||m.level)+'.'+(d.epitaph?' “'+esc(d.epitaph)+'”':'')+'</div>';}
  h+='<div class="acts-row"><button class="btn primary" data-act="saveMon" data-id="'+(isNew?'new':m.id)+'">'+(isNew?'Add Pokémon':'Save changes')+'</button>';

  if(!isNew)h+='<button class="btn danger" data-act="delMon" data-id="'+m.id+'">Delete</button>';
  h+='</div>';
  modal(h);
}
function openFaint(id){
  var m=monById(id);if(!m)return;var nb=nextBoss();

  h+='<label class="f" for="f-ep">Epitaph</label><input type="text" id="f-ep" maxlength="100" placeholder="Gone, but never boxed">';

function openEnd(){

function openSettings(){

/* ---------- Actions ---------- */
function commit(msg){save();render();if(msg)toast(msg);}
function readEnc(){return {sp:val('e-sp'),nick:val('e-nick'),lv:clampLv(val('e-lv'),1),nat:val('e-nat'),g:val('e-g'),shiny:checked('e-shiny')};}
function canonical(sp){var d=dex(sp);return d?d.name:sp;}
function clampLv(v,d){var n=parseInt(v,10);if(!n||n<1)return d;return Math.min(100,n);}
var ACT={
  tab:function(id){closeModal();ui.tab=id;render(true);},
  seg:function(id,el){ui[el.dataset.key]=id;render();},
  close:function(){closeModal();},
  confirmOk:function(){var f=pending;closeModal();if(f)f();},
  pickStarter:function(id){ui.starterPick=id;var n=val('s-name'),k=val('s-nick'),nat=val('s-nat');render();document.getElementById('s-name').value=n||state.runName;document.getElementById('s-nick').value=k;document.getElementById('s-nat').value=nat;},
  startRun:function(){
    var s=ui.starterPick,nick=val('s-nick');
    if(!s){toast('Pick a starter first');return;}
    if(!nick){toast('Give your starter a nickname');document.getElementById('s-nick').focus();return;}
    state.runName=val('s-name')||'FireRed Nuzlocke';state.starter=s;state.setup=true;state.started=Date.now();
    var m={id:uid(),species:s,nick:nick,level:5,metLevel:5,nature:val('s-nat'),ability:'',item:'',moves:['','','',''],notes:'',gender:'',area:'pallet',status:'party',shiny:false};
    state.mons.push(m);state.enc.pallet={status:'caught',monId:m.id};
    addLog('Attempt '+state.attempt+' begins. Chose '+s+' and named it '+nick+'.');
    ui.starterPick='';commit('Good luck, '+nick);
  },
  enc:function(id){openEnc(id);},
  pickSp:function(id){var el=document.getElementById('e-sp');el.value=id;document.getElementById('dupe').innerHTML=dupeHtml(id);var n=document.getElementById('e-nick');if(n)n.focus();},
  encCaught:function(id){
    var f=readEnc();
    if(!f.sp){toast('Enter the species');return;}
    if(!f.nick){toast('Nickname it. Rules are rules.');document.getElementById('e-nick').focus();return;}
    var party=mons('party').length;var sp=canonical(f.sp);
    var m={id:uid(),species:sp,nick:f.nick,level:f.lv||1,metLevel:f.lv||1,nature:f.nat,ability:'',item:'',moves:['','','',''],notes:'',gender:f.g,area:id,status:party<6?'party':'box',shiny:f.shiny};
    if(LEGENDS[id]&&state.rules.legends)m.status='box';
    state.mons.push(m);
    if(!(f.shiny&&state.rules.shiny))state.enc[id]={status:'caught',monId:m.id};
    addLog('Caught '+f.nick+' the '+(f.shiny?'shiny ':'')+sp+' on '+AREA[id].name+(m.level?' (Lv '+m.level+')':'')+'.');
    closeModal();commit(f.nick+' joined the '+(m.status==='party'?'party':'box'));
  },
  encFailed:function(id){var f=readEnc();state.enc[id]={status:'failed',species:f.sp?canonical(f.sp):''};addLog('Missed '+(f.sp?canonical(f.sp):'the encounter')+' on '+AREA[id].name+'.');closeModal();commit('Area closed');},
  encSkip:function(id){state.enc[id]={status:'skipped'};addLog('Skipped '+AREA[id].name+'.');closeModal();commit('Skipped');},
  resetEnc:function(id){
    var e=state.enc[id];var m=e&&e.monId?monById(e.monId):null;
    confirmBox('Reset '+AREA[id].name+'?',m?'This reopens the area. '+esc(m.nick)+' stays on your team. Delete it from the Team tab if it was logged by mistake.':'This reopens the area so you can log it again.','Reset area',function(){delete state.enc[id];addLog('Reset '+AREA[id].name+'.');commit('Area reopened');},true);
  },
  lvUp:function(id){var m=monById(id);if(!m)return;m.level=Math.min(100,m.level+1);var cap=nextCap();save();render();if(cap&&m.level>cap.ace)toast(m.nick+' is over the cap of '+cap.ace+'!');else toast(m.nick+' grew to Lv '+m.level);},
  toBox:function(id){var m=monById(id);m.status='box';commit(m.nick+' moved to the box');},
  toParty:function(id){if(mons('party').length>=6){toast('Party is full. Box someone first.');return;}var m=monById(id);if(LEGENDS[m.area]&&state.rules.legends){toast('No-legendaries rule is on');return;}m.status='party';commit(m.nick+' joined the party');},
  editMon:function(id){openMon(id);},
  saveMon:function(id){
    var nick=val('m-nick'),sp=val('m-sp');
    if(!nick||!sp){toast('Nickname and species are required');return;}
    var lv=clampLv(val('m-lv'),1);
    var moves=[0,1,2,3].map(function(i){return val('m-mv'+i);});
    if(id==='new'){
      var where=val('m-where');var full=mons('party').length>=6;
      var m={id:uid(),species:canonical(sp),nick:nick,level:lv,metLevel:lv,nature:val('m-nat'),ability:val('m-ab'),item:val('m-item'),moves:moves,notes:val('m-notes'),gender:val('m-g'),area:'',where:where||'added manually',status:full?'box':'party',shiny:false};
      state.mons.push(m);addLog('Added '+nick+' the '+m.species+(where?' ('+where+')':'')+'.');closeModal();commit(nick+' added');return;
    }
    var mm=monById(id);var oldSp=mm.species;
    mm.nick=nick;mm.species=canonical(sp);mm.level=lv;mm.nature=val('m-nat');mm.ability=val('m-ab');mm.item=val('m-item');mm.moves=moves;mm.notes=val('m-notes');mm.gender=val('m-g');
    if(norm(oldSp)!==norm(mm.species))addLog(nick+' evolved or changed from '+oldSp+' into '+mm.species+'.');
    closeModal();commit('Saved');
  },
  delMon:function(id){var m=monById(id);confirmBox('Delete '+m.nick+'?','Use this only for mistakes. A Pokémon that fainted belongs in the Graveyard, not deleted. Any area it was caught on will reopen.','Delete',function(){state.mons=state.mons.filter(function(x){return x.id!==id;});Object.keys(state.enc).forEach(function(k){if(state.enc[k].monId===id)delete state.enc[k];});commit('Deleted');},true);},
  faintOpen:function(id){openFaint(id);},
  doFaint:function(id){
    var m=monById(id);m.status='dead';
    m.death={by:val('f-by'),where:val('f-where'),level:clampLv(val('f-lv'),m.level),epitaph:val('f-ep'),t:Date.now()};
    addLog(m.nick+' the '+m.species+' died'+(m.death.by?' to '+m.death.by:'')+(m.death.where?' at '+m.death.where:'')+'.');
    closeModal();save();render();
    toast(mons('party').length?'Rest easy, '+m.nick:'Party wiped. Check the Run tab.');
  },
  undoDeath:function(id){var m=monById(id);m.status=mons('party').length<6?'party':'box';delete m.death;addLog('Undid '+m.nick+'’s death (logged by mistake).');closeModal();commit(m.nick+' is back');},
  beat:function(id){
    var b=BOSS[id];
    if(state.beaten[id]){confirmBox('Undo '+bossLabel(b)+'?','This marks the fight as not beaten and moves the level cap back.','Undo',function(){delete state.beaten[id];addLog('Unmarked '+bossLabel(b)+'.');commit('Undone');},true);return;}
    state.beaten[id]=Date.now();
    addLog('Beat '+bossLabel(b)+(b.badge?' and earned the '+b.badge+' Badge':'')+'.');
    save();render();
    if(id==='champ'){modal(mh('Hall of Fame','You did it')+'<p>The Champion is down. That’s a full FireRed nuzlocke'+(mons('dead').length?', with '+mons('dead').length+' fallen along the way':', and with zero deaths, which is frankly suspicious')+'.</p><div class="acts-row"><button class="btn good" data-act="endOpen">Archive as Hall of Fame</button><button class="btn quiet" data-act="close">Later</button></div>');return;}
    var cap=nextCap();toast(b.badge?b.badge+' Badge earned'+(cap?'. New cap: '+cap.ace:''):'Beaten');
  },
  addNote:function(){var t=val('noteIn');if(!t)return;addLog(t);commit('Noted');},
  logAll:function(){ui.logAll=!ui.logAll;render();},
  endOpen:function(){openEnd();},
  doEnd:function(){
    var res=val('end-res'),notes=val('end-notes');var nb=nextBoss();
    var rec={attempt:state.attempt,runName:state.runName,result:res,badges:badgeCount(),deaths:mons('dead').length,caught:state.mons.length,started:state.started,ended:Date.now(),lastBoss:nb?bossLabel(nb):'Champion',survivors:mons('party').map(function(m){return m.nick+' ('+m.species+')';}),notes:notes};
    var hist=state.history.concat([rec]);var ns=fresh(state);ns.history=hist;state=ns;
    closeModal();ui.tab='run';save();render(true);toast(res==='Hall of Fame'?'Legendary. Saved to history.':'Attempt '+rec.attempt+' archived. Again!');
  },
  settings:function(){openSettings();},
  saveSettings:function(){state.runName=val('set-name')||'FireRed Nuzlocke';closeModal();commit('Saved');},
  wipeAll:function(){confirmBox('Erase everything?','This deletes this run and every past attempt from this device. There’s no undo.','Erase everything',function(){var th=state.theme;state=fresh();state.theme=th;ui.tab='run';commit('Erased');},true);},
  exportOpen:function(){openExport();},
  copyExp:function(){
    var ta=document.getElementById('exp');ta.focus();ta.select();try{ta.setSelectionRange(0,ta.value.length);}catch(e){}
    var done=function(){toast('Copied. Paste it into Notes.');};
    var fallback=function(){var ok=false;try{ok=document.execCommand('copy');}catch(e){}toast(ok?'Copied. Paste it into Notes.':'Text selected. Use your phone’s Copy.');};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(done,fallback);else fallback();
  },
  importOpen:function(){openImport();},
  doImport:function(){
    var raw=document.getElementById('imp').value.trim(),err=document.getElementById('impErr');
    try{var s=JSON.parse(raw);if(!s||s.v!==1||!Array.isArray(s.mons))throw new Error('x');var f=fresh();for(var k in s)f[k]=s[k];f.rules=Object.assign(defaultRules(),s.rules||{});state=f;closeModal();ui.tab='run';commit('Backup restored');}
    catch(e){err.innerHTML='<div class="note bad">That doesn’t look like a tracker backup. Copy the whole block from Back up and try again.</div>';}
  },
  theme:function(id){state.theme=id;commit();},
  tcClear:function(){ui.tc.sp='';render();}
};

/* ---------- Events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var fn=ACT[t.dataset.act];if(fn){e.preventDefault();fn(t.dataset.id,t,e);}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.rule){state.rules[t.dataset.rule]=t.checked;addLog((t.checked?'Turned on ':'Turned off ')+OPT_RULES.filter(function(o){return o.id===t.dataset.rule;})[0].name+'.');save();renderHeader();toast('Rule updated');return;}
  if(t.dataset&&t.dataset.tc){ui.tc[t.dataset.tc]=t.value;render();return;}
  if(t.id==='tc-sp'){ui.tc.sp=t.value.trim();render();var el=document.getElementById('tc-sp');if(el&&!dex(ui.tc.sp))el.focus();}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&document.querySelector('.modal-back'))closeModal();
  if(e.key==='Enter'&&e.target&&e.target.id==='noteIn'){e.preventDefault();ACT.addNote();}
});

/* ---------- Init ---------- */
document.getElementById('dexlist').innerHTML=DEXNAMES.map(function(n){return '<option value="'+esc(n)+'">';}).join('');
document.getElementById('wherelist').innerHTML=AREAS.map(function(a){return '<option value="'+esc(a.name)+'">';}).join('')+BOSSES.map(function(b){return '<option value="'+esc(bossLabel(b))+'">';}).join('');
save();render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready;}).then(function(){offlineReady=true;if(ui.tab==='run'&&!document.querySelector('.modal-back'))render();}).catch(function(){});}
})();
</script>
</body>
</html>
